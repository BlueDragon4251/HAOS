name: HAOS x86_64 image and installer build

on:
  push:
    branches: ['agent/haos-*']
    paths: ['linux/**', 'apps/**', 'packages/**', 'scripts/**', 'tests/e2e/**', 'package*.json', 'upstream/*.lock', '.containerignore', '.github/workflows/haos-image.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep evidence for each source commit when another commit is being reviewed.
  group: haos-image-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Reclaim unused toolchains on the disposable build runner
        run: |
          set -euo pipefail
          df -h /
          # These preinstalled SDKs are not inputs to the HAOS build.
          for path in /usr/share/dotnet /usr/local/lib/android /opt/ghc; do
            if [[ -d "$path" ]]; then sudo du -sh "$path"; sudo rm -rf -- "$path"; fi
          done
          df -h /
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Build the native shell from this commit
        run: |
          npm run sync-upstream
          npm ci
          npm run dist:linux --workspace apps/desktop -- --x64
          cp apps/desktop/release/herald-os-*-linux-x64.tar.gz herald-os-linux.tar.gz
          mkdir -p evidence
          npm sbom --sbom-format cyclonedx --omit dev > evidence/npm.cdx.json
      - name: Build the pinned-runtime Fedora bootc image
        run: |
          set -euo pipefail
          sudo podman build -f linux/image/Containerfile --build-arg SHELL_TARBALL=herald-os-linux.tar.gz -t localhost/haos:ci . 2>&1 | tee evidence/image-build.log
          sudo podman image inspect localhost/haos:ci > evidence/image.json
          sudo podman image inspect quay.io/fedora/fedora-bootc:44 > evidence/base-image.json
          sudo podman run --rm localhost/haos:ci rpm -qa --qf '%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' > evidence/rpm-packages.txt
      - name: Build the UEFI x86_64 installer ISO from the local image
        run: |
          set -euo pipefail
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer --security-opt label=type:unconfined_t \
            -v ./output:/output -v ./linux/image/iso.toml:/config.toml:ro \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest --type anaconda-iso --rootfs btrfs --local localhost/haos:ci \
            2>&1 | tee evidence/iso-build.log
          sudo chown -R "$(id -u):$(id -g)" output
          mv output/bootiso/install.iso evidence/haos-x86_64-development.iso
          (cd evidence && sha256sum haos-x86_64-development.iso > SHA256SUMS)
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          def pin(file):
              return dict(line.split('=', 1) for line in Path(file).read_text().splitlines() if line and not line.startswith('#'))
          manifest = {'schema': 1, 'release': False, 'signed': False, 'source_commit': os.environ['GITHUB_SHA'],
                      'source_repository': os.environ['GITHUB_REPOSITORY'], 'architecture': 'x86_64',
                      'herald': pin('upstream/HERALD.lock'), 'hermes': pin('upstream/UPSTREAM.lock'),
                      'image': json.loads(Path('evidence/image.json').read_text()),
                      'base_image': json.loads(Path('evidence/base-image.json').read_text()),
                      'checksums': Path('evidence/SHA256SUMS').read_text(),
                      'limitations': ['unsigned development build', 'requires successful QEMU and security acceptance before release',
                                      'npm SBOM and RPM inventory do not constitute a complete multi-ecosystem release SBOM']}
          Path('evidence/build-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haos-x86_64-build-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7

  install:
    name: Install and verify in disposable QEMU
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
      - name: Reclaim unused SDKs on the disposable VM runner
        run: |
          for path in /usr/share/dotnet /usr/local/lib/android /opt/ghc; do
            if [[ -d "$path" ]]; then sudo rm -rf -- "$path"; fi
          done
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: haos-x86_64-build-${{ github.sha }}
          path: image-evidence
      - name: Verify ISO checksum and prepare the VM tools
        run: |
          (cd image-evidence && sha256sum -c SHA256SUMS)
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf p7zip-full e2fsprogs acl ripgrep
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Install, enforce multi-disk boundaries and reboot
        run: bash scripts/test-haos-iso.sh image-evidence/haos-x86_64-development.iso vm-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haos-qemu-acceptance-${{ github.sha }}
          path: vm-evidence/
          if-no-files-found: error
          retention-days: 7
