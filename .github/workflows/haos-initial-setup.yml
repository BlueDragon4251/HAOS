name: HAOS Graphical Initial Setup Security
on:
  push:
    branches: [agent/haos-foundation]
    paths:
      - 'linux/haos/haos/initial_setup.py'
      - 'linux/haos/haos/owner.py'
      - 'linux/haos/tests/test_owner_setup_console.py'
      - 'linux/haos/haos/owner_ready.py'
      - 'linux/haos/haos/initial_setup_gui.py'
      - 'linux/haos/tests/test_initial_setup*.py'
      - 'linux/haos/setup-display.sh'
      - 'linux/haos/haos-setup-desktop.service'
      - 'linux/haos/haos/setup_gate.py'
      - 'linux/haos/haos/normal_profile.py'
      - 'linux/haos/tests/test_normal_profile.py'
      - 'linux/image/packages.txt'
      - 'linux/image/firstboot.sh'
      - 'linux/image/herald-os-firstboot.service'
      - 'linux/haos/tests/test_firstboot_graphical_wiring.py'
      - 'linux/haos/tests/test_setup_gate.py'
      - 'linux/bin/haos-setup-gate'
      - 'linux/haos/install.sh'
      - 'linux/bin/haos-setup-desktop'
      - '.github/workflows/haos-initial-setup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Verify immutable launcher shell and Python syntax
        run: |
          bash -n linux/haos/setup-display.sh linux/haos/setup-gui-session.sh linux/haos/install.sh linux/image/firstboot.sh
          python -m compileall -q linux/haos/haos/initial_setup.py linux/haos/haos/initial_setup_gui.py linux/haos/haos/setup_gate.py
      - name: Verify owner and physical session boundaries
        env:
          PYTHONPATH: linux/haos
        run: |
          python -m pip install pytest
          python -m pytest -q linux/haos/tests/test_initial_setup.py linux/haos/tests/test_initial_setup_gui.py linux/haos/tests/test_setup_gate.py linux/haos/tests/test_normal_profile.py linux/haos/tests/test_firstboot_graphical_wiring.py linux/haos/tests/test_owner_setup_console.py
      - name: Render native setup under virtual X display (nonprivileged fixture)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-tk xvfb xauth
          xvfb-run -a /usr/bin/python3 - <<'PY'
          import sys
          sys.path.insert(0, "linux/haos")
          import tkinter
          from haos import initial_setup
          initial_setup.account_status=lambda: {"owner": True, "recovery": True, "complete": True, "pending": False}
          initial_setup.normal_user_ready=lambda: True
          initial_setup.setup_in_progress=lambda: False
          from haos.initial_setup_gui import Wizard
          wizard=Wizard(tkinter)
          # Xvfb has no window manager: EWMH -fullscreen alone previously left
          # the root wizard window tiny in the upper-left corner of the screen.
          wizard.root.update()
          assert wizard.root.overrideredirect(), "Kiosk setup must not need a window manager"
          assert (wizard.root.winfo_width(), wizard.root.winfo_height()) == (
              wizard.root.winfo_screenwidth(), wizard.root.winfo_screenheight()), (
              wizard.root.geometry(), wizard.root.winfo_screenwidth(), wizard.root.winfo_screenheight())
          assert (wizard.root.winfo_rootx(), wizard.root.winfo_rooty()) == (0, 0)
          for page in ("security", "user", "region", "provider", "updates", "gateways", "finish"):
              wizard.show(page)
              wizard.root.update_idletasks()
              assert wizard.content.winfo_children(), page
          import time
          wizard._run_async(lambda: time.sleep(0.05), success="Async operation complete")
          assert wizard.running
          for _ in range(80):
              wizard.root.update()
              if not wizard.running:
                  break
              time.sleep(0.02)
          assert not wizard.running, "Setup must not freeze during slow operations"
          assert "Async operation complete" in wizard.status.cget("text")
          # Every asynchronous exception must unblock the wizard. Never leak
          # a credential-bearing exception message back into the screen.
          from tkinter import messagebox
          import subprocess
          messagebox.showerror = lambda *args: None
          def fail():
              raise subprocess.CalledProcessError(12, "private-ghcr-command")
          wizard._run_async(fail, success="MUST NOT SUCCEED")
          for _ in range(80):
              wizard.root.update()
              if not wizard.running:
                  break
              time.sleep(0.02)
          assert not wizard.running, "An unhandled OS error must never freeze setup"
          assert "fehlgeschlagen" in wizard.status.cget("text")
          wizard.root.destroy()
          print("All seven native HAOS setup pages and live operation state rendered under Xvfb")
          PY
      - name: Verify 640x480 graphical setup with a scrolling small-screen layout
        run: |
          xvfb-run -a -s '-screen 0 640x480x24' /usr/bin/python3 - <<'PY'
          import sys
          sys.path.insert(0, 'linux/haos')
          import tkinter
          from haos import initial_setup
          from haos.initial_setup_gui import Wizard
          initial_setup.account_status = lambda: {'owner': True, 'recovery': True, 'complete': True, 'pending': False}
          initial_setup.normal_user_ready = lambda: True
          initial_setup.setup_in_progress = lambda: False
          wizard = Wizard(tkinter)
          wizard.root.update()
          assert wizard.compact
          assert wizard.root.winfo_screenwidth() == 640
          assert (wizard.root.winfo_width(), wizard.root.winfo_height()) == (640, 480)
          assert (wizard.root.winfo_rootx(), wizard.root.winfo_rooty()) == (0, 0)
          for page in ('security', 'user', 'region', 'provider', 'updates', 'gateways', 'finish'):
              wizard.show(page)
              wizard.root.update()
              assert wizard.content.winfo_children(), page
          assert wizard.viewport.winfo_width() > 100
          assert wizard.root.winfo_reqwidth() <= 640
          wizard.root.destroy()
          print('All seven setup pages render within a 640x480 X screen')
          PY
      - name: Assert firstboot and migration gate wiring
        run: |
          grep -F 'systemctl enable haos-setup-desktop.service' linux/haos/install.sh
          grep -F 'WantedBy=multi-user.target' linux/haos/haos-setup-desktop.service
          grep -F 'After=systemd-user-sessions.service herald-os-firstboot.service' linux/haos/haos-setup-desktop.service
          ! grep -F 'systemctl --no-block start graphical.target' linux/image/firstboot.sh
          grep -F 'ExecCondition=/usr/bin/haos-setup-gate prompt' linux/haos/haos-setup-desktop.service
          grep -F 'ExecCondition=/usr/bin/haos-setup-gate desktop' linux/haos/install.sh
          grep -F 'HAOS_TRUSTED_SETUP=1' linux/haos/setup-display.sh
          grep -F -- '-nolisten tcp' linux/haos/setup-display.sh
          grep -F 'XAUTHORITY=' linux/haos/setup-display.sh
