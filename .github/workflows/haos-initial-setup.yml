          wizard.root.setvar(menu.cget('textvariable'), 'mattermost')
          wizard.root.update()
          assert wizard.root.winfo_reqwidth() <= 640, 'Mattermost setup overflows the compact screen'
          wizard.root.setvar(menu.cget('textvariable'), 'slack')
          wizard.root.update()
          assert wizard.root.winfo_reqwidth() <= 640, 'Slack credentials overflow the small setup screen'
          import time
          initial_setup.gateway_deliveries = lambda after=0: {"deliveries": [{"delivery_id": "c" * 64, "attempt": 1,
              "state": "uncertain", "mission_id": "00000000-0000-4000-8000-000000000001"}], "next_cursor": 1}
          next(item for item in wizard.content.winfo_children()
               if isinstance(item, tkinter.Button) and item.cget("text") == "Missionsdienste stoppen und ungeklärte Zustellungen prüfen").invoke()
          for _ in range(80):
