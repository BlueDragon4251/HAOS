name: HAOS prepared Google Chat contracts
on:
  pull_request:
    paths: ['linux/haos/haos/gateway_google_chat*.py', 'linux/haos/haos/google_chat_*.py', 'linux/haos/haos/gateway.py', 'linux/haos/haos/gateway_runtime.py', 'linux/haos/haos/gateway_publication.py', 'linux/haos/haos/gateway_outbound.py', 'linux/haos/haos/gateway_setup.py', 'linux/haos/haos/initial_setup*.py', 'linux/haos/haos/owner.py', 'linux/haos/build-runtime.sh', 'linux/haos/probes/test_gateway_authority.py', 'linux/haos/tests/test_google_chat_owner*.py', 'linux/haos/tests/test_google_chat_retired*.py', 'linux/haos/runtime/**', 'linux/haos/tests/test_gateway_google_chat*.py', 'linux/haos/probes/probe_google_chat*.py', '.github/workflows/haos-google-chat-contracts.yml', 'upstream/UPSTREAM.lock']
  push:
    branches: ['agent/hermes-parity-mobile', 'agent/haos-foundation']
    paths: ['linux/haos/haos/gateway_google_chat*.py', 'linux/haos/haos/google_chat_*.py', 'linux/haos/haos/gateway.py', 'linux/haos/haos/gateway_runtime.py', 'linux/haos/haos/gateway_publication.py', 'linux/haos/haos/gateway_outbound.py', 'linux/haos/haos/gateway_setup.py', 'linux/haos/haos/initial_setup*.py', 'linux/haos/haos/owner.py', 'linux/haos/build-runtime.sh', 'linux/haos/probes/test_gateway_authority.py', 'linux/haos/tests/test_google_chat_owner*.py', 'linux/haos/tests/test_google_chat_retired*.py', 'linux/haos/runtime/**', 'linux/haos/tests/test_gateway_google_chat*.py', 'linux/haos/probes/probe_google_chat*.py', '.github/workflows/haos-google-chat-contracts.yml', 'upstream/UPSTREAM.lock']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: google-chat-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepared-native-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - name: Prepare exact frozen optional Google Chat SDK without public activation
        run: |
          set -euo pipefail
          python -m pip install uv
          bash scripts/sync-upstream.sh
          python linux/haos/runtime/prepare.py upstream/hermes-agent linux/haos/runtime
          uv sync --project upstream/hermes-agent --frozen --python 3.11 --no-dev --extra web --extra messaging --extra anthropic --extra bedrock --extra vertex --extra azure-identity --extra matrix --extra voice --extra feishu --extra dingtalk --extra google-chat
          uv pip install --python upstream/hermes-agent/.venv/bin/python --require-hashes --no-deps -r linux/haos/runtime/requirements.txt
          uv pip check --python upstream/hermes-agent/.venv/bin/python
      - name: Actual native codec token validation pre-ACK custody and bounded text HTTP fixtures
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/google-chat-contracts"
          PYTHON="$PWD/upstream/hermes-agent/.venv/bin/python"
          "$PYTHON" linux/haos/runtime/probe_google_chat_codec.py upstream/hermes-agent "$RUNNER_TEMP/google-chat-contracts/codec.json"
          "$PYTHON" linux/haos/runtime/probe_google_chat_auth.py "$RUNNER_TEMP/google-chat-contracts/auth.json"
          "$PYTHON" linux/haos/runtime/probe_google_chat_pubsub_custody.py "$RUNNER_TEMP/google-chat-contracts/pubsub-custody.json"
          "$PYTHON" linux/haos/runtime/probe_google_chat_text.py upstream/hermes-agent "$RUNNER_TEMP/google-chat-contracts/text.json"
      - name: Actual private gateway UID TLS PubSub RPC and HTTPS callback custody
        run: |
          set -euo pipefail
          SDK_SITE="$PWD/upstream/hermes-agent/.venv/lib/python3.11/site-packages"
          for mode in pubsub http; do
            if [ "$mode" = pubsub ]; then FLAG=HAOS_DISPOSABLE_GOOGLE_CHAT_PROCESS; else FLAG=HAOS_DISPOSABLE_GOOGLE_CHAT_HTTP_PROCESS; fi
            docker run --rm --network none --security-opt no-new-privileges --pids-limit 128 --memory 1g \
              -v "$PWD:/repo:ro" -v "$SDK_SITE:/deps:ro" \
              -v "$PWD/linux/haos/probes/probe_google_chat_${mode}_process.py:/probe.py:ro" \
              -e "$FLAG=1" \
              python@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89 \
              python3 /probe.py > "$RUNNER_TEMP/google-chat-contracts/$mode-process.json"
          done
      - name: Actual Root offline file decisions and native SDK recovery across private process restarts
        run: |
          set -euo pipefail
          SDK_SITE="$PWD/upstream/hermes-agent/.venv/lib/python3.11/site-packages"
          for SCENE in recover-upload recover-create recover-late recover-read-disconnect recover-read-body recover-output-purge; do
            docker run --rm --network none --security-opt no-new-privileges --pids-limit 128 --memory 1g \
              -v "$PWD:/repo:ro" -v "$SDK_SITE:/deps:ro" \
              -v "$PWD/linux/haos/probes/probe_google_chat_file_process.py:/probe.py:ro" \
              -e HAOS_DISPOSABLE_GOOGLE_CHAT_FILE_PROCESS=1 -e "HAOS_GOOGLE_CHAT_FILE_SCENE=$SCENE" \
              python@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89 \
              python3 /probe.py > "$RUNNER_TEMP/google-chat-contracts/native-file-$SCENE.json"
          done
      - name: Actual private profile account lifecycle controller replies and persistent auth rate recovery
        run: |
          set -euo pipefail
          SDK_SITE="$PWD/upstream/hermes-agent/.venv/lib/python3.11/site-packages"
          for SCENE in active auth rate tokenrate sendauth media mediaauth mediarate mediarange medialarge pubsub pubsubauth pubsubrate pubsubdisconnect; do
            docker run --rm --network none --security-opt no-new-privileges --pids-limit 128 --memory 1g \
              -v "$PWD:/repo:ro" -v "$SDK_SITE:/deps:ro" \
              -v "$PWD/linux/haos/probes/probe_google_chat_profile_process.py:/probe.py:ro" \
              -e HAOS_DISPOSABLE_GOOGLE_CHAT_PROFILE_PROCESS=1 -e "HAOS_GOOGLE_CHAT_PROFILE_ACCOUNT=$SCENE" \
              python@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89 \
              python3 /probe.py > "$RUNNER_TEMP/google-chat-contracts/profile-$SCENE.json"
          done
      - name: Actual controller gateway UID separation kernel Unix IPC and Google image bytes
        run: |
          set -euo pipefail
          SDK_SITE="$PWD/upstream/hermes-agent/.venv/lib/python3.11/site-packages"
          for SCENE in pubsub active media; do
            docker run --rm --network none --security-opt no-new-privileges --pids-limit 128 --memory 1g \
              -v "$PWD:/repo:ro" -v "$SDK_SITE:/deps:ro" \
              -v "$PWD/linux/haos/probes/probe_google_chat_profile_process.py:/probe.py:ro" \
              -e HAOS_DISPOSABLE_GOOGLE_CHAT_PROFILE_PROCESS=1 -e HAOS_GOOGLE_CHAT_CONTROLLER_IPC=1 \
              -e "HAOS_GOOGLE_CHAT_PROFILE_ACCOUNT=$SCENE" \
              python@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89 \
              python3 /probe.py > "$RUNNER_TEMP/google-chat-contracts/controller-ipc-$SCENE.json"
          done
      - name: Actual Google voice video and mid-transcription withdrawal across private processes
        run: |
          set -euo pipefail
          SDK_SITE="$PWD/upstream/hermes-agent/.venv/lib/python3.11/site-packages"
          upstream/hermes-agent/.venv/bin/python linux/haos/runtime/fetch_speech_fixture.py linux/haos "$RUNNER_TEMP/google-chat-speech"
          for SCENE in voice video revoke; do
            KIND="$SCENE"
            REVOKE=0
            if test "$SCENE" = revoke; then KIND=voice; REVOKE=1; fi
            docker run --rm --network none --security-opt no-new-privileges --pids-limit 128 --memory 1g \
              -v "$PWD:/repo:ro" -v "$SDK_SITE:/deps:ro" \
              -v "$RUNNER_TEMP/google-chat-speech/reference.flac:/public-input/reference.flac:ro" \
              -v "$RUNNER_TEMP/google-chat-speech/model:/public-model:ro" \
              -v "$PWD/linux/haos/probes/probe_google_chat_profile_process.py:/probe.py:ro" \
              -e HAOS_DISPOSABLE_GOOGLE_CHAT_PROFILE_PROCESS=1 -e HAOS_GOOGLE_CHAT_CONTROLLER_IPC=1 \
              -e "HAOS_GOOGLE_CHAT_PROFILE_ACCOUNT=$KIND" -e "HAOS_GOOGLE_CHAT_MEDIA_REVOKE=$REVOKE" \
              python@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89 \
              python3 /probe.py > "$RUNNER_TEMP/google-chat-contracts/local-media-$SCENE.json"
          done
      - name: Actual private UID OAuth enrollment refresh revocation and rejected-credential disposal
        run: |
          set -euo pipefail
          SDK_SITE="$PWD/upstream/hermes-agent/.venv/lib/python3.11/site-packages"
          docker run --rm --network none --security-opt no-new-privileges --pids-limit 128 --memory 1g \
            -v "$PWD:/repo:ro" -v "$SDK_SITE:/deps:ro" \
            -v "$PWD/linux/haos/probes/probe_google_chat_oauth_process.py:/probe.py:ro" \
            -e HAOS_DISPOSABLE_GOOGLE_CHAT_OAUTH_PROCESS=1 \
            python@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89 \
            python3 /probe.py > "$RUNNER_TEMP/google-chat-contracts/oauth-process.json"
      - name: Actual UID public app identity migration immutable metadata and damaged record preservation without SDK
        run: |
          set -euo pipefail
          docker run --rm --network none --security-opt no-new-privileges --pids-limit 128 --memory 1g \
            -v "$PWD:/repo:ro" -v "$PWD/linux/haos/probes/probe_google_chat_identity_process.py:/probe.py:ro" \
            -e HAOS_DISPOSABLE_GOOGLE_CHAT_IDENTITY_PROCESS=1 \
            python@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89 \
            python3 /probe.py > "$RUNNER_TEMP/google-chat-contracts/account-identity-process.json"
      - name: Actual Root backend and private UID recovery without optional SDK dependencies
        run: |
          set -euo pipefail
          docker run --rm --network none --security-opt no-new-privileges --pids-limit 128 --memory 1g \
            -v "$PWD:/repo:ro" -v "$PWD/linux/haos/probes/probe_google_chat_owner_process.py:/probe.py:ro" \
            -e HAOS_DISPOSABLE_GOOGLE_CHAT_OWNER_PROCESS=1 \
            python@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89 \
            python3 /probe.py > "$RUNNER_TEMP/google-chat-contracts/owner-process.json"
      - name: Actual Root OAuth handoff private UID PKCE signed identity and one-shot withdrawal
        run: |
          set -euo pipefail
          SDK_SITE="$PWD/upstream/hermes-agent/.venv/lib/python3.11/site-packages"
          docker run --rm --network none --security-opt no-new-privileges --pids-limit 128 --memory 1g \
            -v "$PWD:/repo:ro" -v "$SDK_SITE:/deps:ro" \
            -v "$PWD/linux/haos/probes/probe_google_chat_owner_oauth_process.py:/probe.py:ro" \
            -e HAOS_DISPOSABLE_GOOGLE_CHAT_OWNER_OAUTH_PROCESS=1 \
            python@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89 \
            python3 /probe.py > "$RUNNER_TEMP/google-chat-contracts/owner-oauth-process.json"
      - name: Actual shared production service Root publication readonly service credentials controller IPC reconnect and withdrawal
        run: |
          set -euo pipefail
          SDK_SITE="$PWD/upstream/hermes-agent/.venv/lib/python3.11/site-packages"
          for SCENE in active pubsub; do
            docker run --rm --network none --security-opt no-new-privileges --pids-limit 128 --memory 1g \
              -v "$PWD:/repo:ro" -v "$SDK_SITE:/deps:ro" \
              -v "$PWD/linux/haos/probes/probe_google_chat_profile_process.py:/probe.py:ro" \
              -e HAOS_DISPOSABLE_GOOGLE_CHAT_PROFILE_PROCESS=1 -e HAOS_GOOGLE_CHAT_CONTROLLER_IPC=1 \
              -e "HAOS_GOOGLE_CHAT_PROFILE_ACCOUNT=$SCENE" -e HAOS_GOOGLE_CHAT_PRODUCTION_SERVE=1 \
              python@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89 \
              python3 /probe.py > "$RUNNER_TEMP/google-chat-contracts/production-service-$SCENE.json"
          done
      - name: Actual Root historical account recovery after connector and all service account credentials are removed
        run: |
          set -euo pipefail
          SDK_SITE="$PWD/upstream/hermes-agent/.venv/lib/python3.11/site-packages"
          docker run --rm --network none --security-opt no-new-privileges --pids-limit 128 --memory 1g \
            -v "$PWD:/repo:ro" -v "$SDK_SITE:/deps:ro" \
            -v "$PWD/linux/haos/probes/probe_google_chat_owner_oauth_process.py:/probe.py:ro" \
            -e HAOS_DISPOSABLE_GOOGLE_CHAT_OWNER_OAUTH_PROCESS=1 -e HAOS_GOOGLE_CHAT_RETIRED_OAUTH_PROCESS=1 \
            python@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89 \
            python3 /probe.py > "$RUNNER_TEMP/google-chat-contracts/historical-owner-process.json"
      - name: Actual native file adapter private user SDK upload fences echo suppression and controller components
        run: |
          set -euo pipefail
          SDK_SITE="$PWD/upstream/hermes-agent/.venv/lib/python3.11/site-packages"
          for SCENE in active upload-auth upload-rate upload-disconnect create-auth create-rate create-disconnect response-mismatch callback-no-client local-logout publisher; do
            docker run --rm --network none --security-opt no-new-privileges --pids-limit 128 --memory 1g \
              -v "$PWD:/repo:ro" -v "$SDK_SITE:/deps:ro" \
              -v "$PWD/linux/haos/probes/probe_google_chat_file_process.py:/probe.py:ro" \
              -e HAOS_DISPOSABLE_GOOGLE_CHAT_FILE_PROCESS=1 -e "HAOS_GOOGLE_CHAT_FILE_SCENE=$SCENE" \
              python@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89 \
              python3 /probe.py > "$RUNNER_TEMP/google-chat-contracts/native-file-$SCENE.json"
          done
      - name: Actual Root historical output ownership after key rotation removal and legacy metadata migration
        run: |
          set -euo pipefail
          SDK_SITE="$PWD/upstream/hermes-agent/.venv/lib/python3.11/site-packages"
          for MODE in removed rotated legacy unassociated; do
            docker run --rm --network none --security-opt no-new-privileges --pids-limit 128 --memory 1g \
              -v "$PWD:/repo:ro" -v "$SDK_SITE:/deps:ro" \
              -v "$PWD/linux/haos/probes/probe_google_chat_file_process.py:/probe.py:ro" \
              -e HAOS_DISPOSABLE_GOOGLE_CHAT_FILE_PROCESS=1 -e HAOS_GOOGLE_CHAT_FILE_SCENE=recover-output-purge \
              -e "HAOS_GOOGLE_CHAT_HISTORICAL_OUTPUT=$MODE" \
              python@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89 \
              python3 /probe.py > "$RUNNER_TEMP/google-chat-contracts/historical-output-$MODE.json"
          done
      - name: Actual Tk recovery controls on desktop and compact screens with explicit backend fixtures
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          for screen in 1440x1000x24 390x640x24; do
            xvfb-run -a -s "-screen 0 $screen" python linux/haos/runtime/probe_google_chat_account_gui.py linux/haos "$RUNNER_TEMP/google-chat-contracts/account-gui-$screen.json"
            xvfb-run -a -s "-screen 0 $screen" python linux/haos/runtime/probe_google_chat_retired_gui.py linux/haos "$RUNNER_TEMP/google-chat-contracts/retired-gui-$screen.json"
            xvfb-run -a -s "-screen 0 $screen" python linux/haos/runtime/probe_google_chat_owner_gui.py linux/haos "$RUNNER_TEMP/google-chat-contracts/owner-gui-$screen.json"
            xvfb-run -a -s "-screen 0 $screen" python linux/haos/runtime/probe_google_chat_oauth_gui.py linux/haos "$RUNNER_TEMP/google-chat-contracts/owner-oauth-gui-$screen.json"
            xvfb-run -a -s "-screen 0 $screen" python linux/haos/runtime/probe_google_chat_file_gui.py linux/haos "$RUNNER_TEMP/google-chat-contracts/file-recovery-gui-$screen.json"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prepared-google-chat-contracts-${{ github.sha }}
          path: ${{ runner.temp }}/google-chat-contracts/
          if-no-files-found: error
          retention-days: 7
