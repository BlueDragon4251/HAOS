name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Fetch the pinned Hermes Agent snapshot
        run: npm run sync-upstream
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Permit the exact Electron launcher to create its Chromium sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq apparmor libgtk-3-0t64 libnss3 libasound2t64 libgbm1 weston
          HAOS_PREVIEW_EXECUTABLE="$(realpath node_modules/electron/dist/electron)"
          case "$HAOS_PREVIEW_EXECUTABLE" in
            "$GITHUB_WORKSPACE"/node_modules/electron/dist/electron) ;;
            *) exit 1 ;;
          esac
          # Only this disposable runner's exact launcher gets userns permission.
          # AppArmor stays enabled; the actual renderer must attest seccomp,
          # NoNewPrivs, zero capabilities and absence of Node in the next step.
          HAOS_PREVIEW_PROFILE="$RUNNER_TEMP/haos-theme-preview.apparmor"
          cat > "$HAOS_PREVIEW_PROFILE" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile haos-theme-preview "$HAOS_PREVIEW_EXECUTABLE" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "$HAOS_PREVIEW_PROFILE"
      - name: Actual isolated Chromium theme render and rejection cases
        if: runner.os == 'Linux'
        id: theme-preview
        timeout-minutes: 2
        env:
          HAOS_DISPOSABLE_SCREEN_TEST: '1'
        run: npm run test:theme-preview --workspace @herald-os/desktop
      - name: Retain only disposable theme screenshots and source-bound receipt
        if: always() && runner.os == 'Linux' && steps.theme-preview.outputs.evidence != ''
        uses: actions/upload-artifact@v4
        with:
          name: theme-preview-${{ github.sha }}
          path: ${{ steps.theme-preview.outputs.evidence }}
          if-no-files-found: error
          retention-days: 7

      - name: Real virtual Wayland and controller socket restart gates
        if: runner.os == 'Linux'
        id: gui-wayland
        timeout-minutes: 3
        env:
          HAOS_DISPOSABLE_SCREEN_TEST: '1'
        run: npm run test:gui-wayland --workspace @herald-os/desktop
      - name: Retain bounded Wayland receipts and disposable form only
        if: always() && runner.os == 'Linux' && steps.gui-wayland.outputs.evidence != ''
        uses: actions/upload-artifact@v4
        with:
          name: gui-wayland-${{ github.sha }}
          path: ${{ steps.gui-wayland.outputs.evidence }}
          if-no-files-found: error
          retention-days: 7
      - name: Actual scoped GUI input, capture and adversarial browser gate
        if: runner.os == 'Linux'
        id: gui-broker
        timeout-minutes: 2
        env:
          HAOS_DISPOSABLE_SCREEN_TEST: '1'
        run: npm run test:gui-broker --workspace @herald-os/desktop
      - name: Retain only disposable GUI fixture and source-bound receipt
        if: always() && runner.os == 'Linux' && steps.gui-broker.outputs.evidence != ''
        uses: actions/upload-artifact@v4
        with:
          name: gui-broker-${{ github.sha }}
          path: ${{ steps.gui-broker.outputs.evidence }}
          if-no-files-found: error
          retention-days: 7

  bridge:
    name: Bridge plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pyyaml
      - name: pytest
        run: HERALD_OS_PYTHON="$(command -v python)" bash scripts/test-bridge.sh

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse every bash and Python script
        run: |
          failed=0
          while IFS= read -r file; do
            case "$(head -n 1 "$file")" in
              '#!'*bash*) bash -n "$file" || failed=1 ;;
              '#!'*python*) python3 -m py_compile "$file" || failed=1 ;;
            esac
          done < <(git ls-files)
          exit "$failed"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash scripts/check-secrets.sh
