name: HAOS disposable account diagnostics

on:
  workflow_dispatch:
  push:
    branches: ['agent/haos-*']
    paths: ['.github/workflows/haos-owner-diagnostics.yml']

permissions:
  contents: read

jobs:
  account:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare syscall metadata tracing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace
      - name: Diagnose only a new disposable account
        run: |
          mkdir -p account-evidence
          sudo env GITHUB_ACTIONS=true HAOS_DISPOSABLE_CI=1 python3 - <<'PY'
          import json, os, pwd, subprocess, time, uuid
          from pathlib import Path
          assert os.geteuid() == 0
          assert os.environ.get('GITHUB_ACTIONS') == 'true' and os.environ.get('HAOS_DISPOSABLE_CI') == '1'
          env = {'PATH': '/usr/sbin:/usr/bin:/sbin:/bin', 'LANG': 'C', 'LC_ALL': 'C'}
          user = 'haos-diag-' + uuid.uuid4().hex[:10]
          home = Path('/home') / user
          assert not home.exists() and not home.is_symlink()
          try:
              pwd.getpwnam(user)
          except KeyError:
              pass
          else:
              raise RuntimeError('fixture account already exists')
          evidence = Path('account-evidence').resolve()
          trace = evidence / 'useradd-metadata.trace'
          # Trace filenames/process operations only: no reads, environment values,
          # credentials or password-bearing command. No password is created here.
          args = ['/usr/bin/strace', '--kill-on-exit', '-f', '-tt', '-o', str(trace),
                  '-e', 'trace=process,file', '--', '/usr/sbin/useradd', '--create-home',
                  '--user-group', '--shell', '/bin/bash', '--', user]
          report = {'diagnostic_only': True, 'username': user, 'timed_out': False}
          for command in (['/usr/sbin/useradd', '-D'], ['/usr/bin/du', '-sk', '/etc/skel']):
              result = subprocess.run(command, env=env, capture_output=True, text=True, timeout=10)
              print(json.dumps({'command': command, 'returncode': result.returncode, 'output': result.stdout}))
          started = time.monotonic()
          try:
              result = subprocess.run(args, env=env, capture_output=True, text=True, timeout=30)
              report['returncode'] = result.returncode
          except subprocess.TimeoutExpired:
              report['timed_out'] = True
          finally:
              report['elapsed_seconds'] = time.monotonic() - started
              try:
                  account = pwd.getpwnam(user)
              except KeyError:
                  report['account_created'] = False
              else:
                  assert account.pw_uid >= 1000 and Path(account.pw_dir) == home
                  report['account_created'] = True
                  result = subprocess.run(['/usr/sbin/userdel', '--remove', '--', user],
                                          env=env, capture_output=True, text=True, timeout=30)
                  report['cleanup_returncode'] = result.returncode
              (evidence / 'result.json').write_text(json.dumps(report, indent=2) + '\n')
              print(json.dumps(report))
              if trace.exists():
                  print('\n'.join(trace.read_text().splitlines()[-60:]))
          assert not report['timed_out'] and report.get('returncode') == 0, 'diagnostic useradd failed'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haos-account-diagnostics-${{ github.run_id }}
          path: account-evidence/
          if-no-files-found: error
          retention-days: 7
