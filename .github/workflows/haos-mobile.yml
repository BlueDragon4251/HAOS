name: HAOS Native Android Mobile
on:
  push:
    branches: [agent/haos-foundation]
    paths: ['apps/mobile/**', '.github/workflows/haos-mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # v4 no longer installs the removed Android SDK 'tools' package.
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: apps/mobile
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK payload and record exact source identity
        run: |
          set -euo pipefail
          APK=apps/mobile/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 1 | grep -Fq 'No errors detected'
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > SHA256SUMS)
          printf 'source_commit=%s\nartifact_kind=debug-apk\nproduction_release=false\n' \
            "$GITHUB_SHA" > "$(dirname "$APK")/BUILD-IDENTITY.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: haos-mobile-debug-apk
          path: |
            apps/mobile/app/build/outputs/apk/debug/app-debug.apk
            apps/mobile/app/build/outputs/apk/debug/SHA256SUMS
            apps/mobile/app/build/outputs/apk/debug/BUILD-IDENTITY.txt
          if-no-files-found: error
          retention-days: 7
