name: HAOS Multi-Provider Policy
on:
  push:
    branches: [agent/haos-foundation]
    paths:
      - 'linux/haos/haos/model_router.py'
      - 'linux/haos/tests/test_model_router.py'
      - '.github/workflows/haos-model-router.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  router-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test privacy, pricing and deterministic failover rules
        env:
          PYTHONPATH: linux/haos
        run: |
          python -m pip install pytest
          python -m pytest -q linux/haos/tests/test_model_router.py
