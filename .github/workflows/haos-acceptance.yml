name: HAOS acceptance of an existing private ISO

on:
  push:
    branches: ['agent/haos-*']
    paths: ['scripts/test-haos-iso.sh', 'scripts/haos-qemu-runtime.py', 'tests/e2e/**', '.github/workflows/haos-acceptance.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: haos-acceptance-${{ github.ref }}
  # TCG installation is slow. A source update must not discard a running
  # image-specific proof; each run already records its exact source identities.
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select a completed image artifact from this branch
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          base = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
          def get(path):
              request = urllib.request.Request(base + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          candidates = get('/actions/artifacts?per_page=100')['artifacts']
          for artifact in candidates:
              match = re.fullmatch(r'haos-x86_64-build-([0-9a-f]{40})', artifact['name'])
              run = artifact.get('workflow_run', {})
              if not match or artifact['expired'] or run.get('head_branch') != os.environ['GITHUB_REF_NAME']:
                  continue
              if match[1] != run.get('head_sha'):
                  continue
              jobs = get(f"/actions/runs/{run['id']}/jobs?per_page=100")['jobs']
              if not any(j['name'] == 'build' and j['conclusion'] == 'success' for j in jobs):
                  continue
              outputs = {'run_id': str(run['id']), 'sha': match[1], 'name': artifact['name']}
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  for key, value in outputs.items():
                      output.write(f'{key}={value}\n')
              print(json.dumps({'selected_image': outputs, 'artifact_id': artifact['id'], 'artifact_digest': artifact.get('digest')}))
              break
          else:
              raise RuntimeError('No completed non-expired image artifact exists on this branch; build one first')
          PY
      - name: Prepare the disposable runner
        run: |
          for path in /usr/share/dotnet /usr/local/lib/android /opt/ghc; do
            if [[ -d "$path" ]]; then sudo rm -rf -- "$path"; fi
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf p7zip-full e2fsprogs acl ripgrep
          if [[ -c /dev/kvm ]]; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm || echo 'KVM ACL unavailable; the harness will probe TCG'
          fi
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.image.outputs.name }}
          run-id: ${{ steps.image.outputs.run_id }}
          github-token: ${{ github.token }}
          path: image-evidence
      - name: Verify the image and use its matching guest protocol
        env:
          IMAGE_SHA: ${{ steps.image.outputs.sha }}
          IMAGE_RUN_ID: ${{ steps.image.outputs.run_id }}
        run: |
          (cd image-evidence && sha256sum -c SHA256SUMS && cat SHA256SUMS)
          git merge-base --is-ancestor "$IMAGE_SHA" HEAD
          git show "$IMAGE_SHA:tests/e2e/haos_guest.py" > image-guest-probe.py
          mkdir -p vm-evidence
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('image-evidence/build-manifest.json').read_text())
          assert manifest['source_commit'] == os.environ['IMAGE_SHA']
          assert manifest['source_repository'] == os.environ['GITHUB_REPOSITORY']
          assert manifest['architecture'] == 'x86_64'
          evidence = {'image_source_commit': manifest['source_commit'], 'guest_probe_commit': manifest['source_commit'],
                      'harness_commit': os.environ['GITHUB_SHA'], 'image_run_id': os.environ['IMAGE_RUN_ID'],
                      'checksums': Path('image-evidence/SHA256SUMS').read_text(), 'production_acceptance': False}
          Path('vm-evidence/test-source.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - name: Install, verify multi-disk boundaries and reboot
        run: bash scripts/test-haos-iso.sh image-evidence/haos-x86_64-development.iso vm-evidence image-guest-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haos-reused-iso-acceptance-${{ github.sha }}
          path: vm-evidence/
          if-no-files-found: error
          retention-days: 7
