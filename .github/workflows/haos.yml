name: HAOS services and kernel boundaries

on:
  pull_request:
  push:
    branches: [dev, 'agent/haos-*']

permissions:
  contents: read

concurrency:
  group: haos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.0.2 websockets==15.0.1
      - run: HAOS_TEST_PYTHON="$(command -v python)" bash scripts/test-haos.sh --ignore=linux/haos/tests/test_backup.py
      - name: Root-authority backup and policy-access tests in disposable fixtures
        run: sudo "$(command -v python)" -m pytest -q linux/haos/tests/test_backup.py linux/haos/probes/test_policy_access.py
      - name: QEMU runtime selection regression tests
        run: python -m pytest -q tests/e2e/test_qemu_runtime.py tests/e2e/test_guest_diagnostics.py
      - name: Real local socket and kernel filesystem probes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap apparmor-profiles qemu-system-x86 restic nftables libpwquality-tools
          # Ubuntu's packaged profile permits the launcher to create its sandbox,
          # then removes capabilities from its children. Keep AppArmor enabled.
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          python -m pytest -q linux/haos/probes --ignore=linux/haos/probes/test_qemu_runtime.py --ignore=linux/haos/probes/test_backup_restore.py --ignore=linux/haos/probes/test_observer_authority.py --ignore=linux/haos/probes/test_network_boundary.py --ignore=linux/haos/probes/test_owner_enrollment.py --ignore=linux/haos/probes/test_policy_access.py
      - name: Record actual diskless QEMU acceleration
        run: python -m pytest -q -s linux/haos/probes/test_qemu_runtime.py
      - name: Restore a deleted disposable project through actual Restic
        run: |
          restic version
          sudo "$(command -v python)" -m pytest -q -s linux/haos/probes/test_backup_restore.py
      - name: Deny inherited observer administrator rights on a disposable account
        run: |
          # Hosted runner's existing rule has a nonstandard mode; tighten only
          # that disposable fixture file before the strict full visudo check.
          if sudo test -f /etc/sudoers.d/runner; then
            sudo stat -c '%a %U %n' /etc/sudoers.d/runner
            sudo chmod 0440 /etc/sudoers.d/runner
          fi
          sudo "$(command -v python)" -m pytest -q -s linux/haos/probes/test_observer_authority.py
      - name: Validate service unit syntax
        run: systemd-analyze verify linux/haos/*.service
      - name: Enforce the actual agent socket UID boundary with nftables
        run: sudo "$(command -v python)" -m pytest -q -s linux/haos/probes/test_network_boundary.py
      - name: Verify real owner password authentication and fixed CLI authority
        run: |
          sudo env GITHUB_ACTIONS=true HAOS_DISPOSABLE_CI=1 "$(command -v python)" - <<'PY'
          import os, shutil, subprocess, sys, tempfile
          from pathlib import Path
          assert os.geteuid() == 0
          assert os.environ.get('GITHUB_ACTIONS') == 'true' and os.environ.get('HAOS_DISPOSABLE_CI') == '1'
          env = {'PATH': '/usr/sbin:/usr/bin:/sbin:/bin', 'LANG': 'C', 'LC_ALL': 'C'}
          def command(*args):
              return subprocess.run(args, env=env, check=True, capture_output=True, text=True, timeout=30)
          defaults = command('/usr/sbin/useradd', '--defaults').stdout.splitlines()
          original = next(line.split('=', 1)[1] for line in defaults if line.startswith('SKEL='))
          assert Path(original).is_absolute()
          skeleton = Path(tempfile.mkdtemp(prefix='haos-owner-skel-', dir='/run'))
          try:
              # Hosted /etc/skel includes ~815 MiB of unrelated toolchains. Use
              # a root-private fixture while retaining the actual enrollment CLI,
              # its deadline and every PAM/sudo assertion.
              command('/usr/sbin/useradd', '--defaults', '--skel', str(skeleton))
              result = subprocess.run([sys.executable, '-m', 'pytest', '-q', '-s',
                                       'linux/haos/probes/test_owner_enrollment.py'])
          finally:
              command('/usr/sbin/useradd', '--defaults', '--skel', original)
              shutil.rmtree(skeleton)
          raise SystemExit(result.returncode)
          PY
