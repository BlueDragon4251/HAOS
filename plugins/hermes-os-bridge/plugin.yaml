name: hermes-os-bridge
version: 0.1.0
description: "Hermes OS system bridge: lets Hermes act on this computer through explicit, permission-tiered tools (system info, processes, Spotlight search, apps, open, kill, files, and the hermes-os control surface on Hermes OS Linux). Every action is audited; mutating and destructive actions go through the standard approval gate."
author: Hermes OS
kind: standalone
requires_hermes: ">=0.21"
platforms:
  - macos
  - linux
  - windows
provides_tools:
  - system_network
  - system_control
  - system_logs
  - system_info
  - system_processes
  - system_disk_usage
  - system_find_files
  - system_apps
  - system_open
  - system_kill_process
  - system_files
  - system_os
